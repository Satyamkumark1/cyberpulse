# architecture/deployment-architecture.md §3. The web app runs from source
# (`make dev`); Vercel builds it in production (DEC-015).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberpulse
      POSTGRES_PASSWORD: cyberpulse
      POSTGRES_DB: cyberpulse
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberpulse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ml-service:
    build: { context: ., dockerfile: docker/Dockerfile.ml }
    ports: ["8000:8000"]
    environment:
      MODEL_DIR: /app/models
      LOG_LEVEL: info
    volumes: ["./apps/ml-service/models:/app/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 6

volumes: { pgdata: }
