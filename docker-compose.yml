# architecture/deployment-architecture.md §3.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberpulse
      POSTGRES_PASSWORD: cyberpulse
      POSTGRES_DB: cyberpulse
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberpulse"]
      interval: 5s
      retries: 10

  ml-service:
    build: { context: ., dockerfile: docker/Dockerfile.ml }
    ports: ["8000:8000"]
    environment:
      MODEL_DIR: /app/models
      LOG_LEVEL: info
    volumes: ["./apps/ml-service/models:/app/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 6

  web:
    build: { context: ., dockerfile: docker/Dockerfile.web }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://cyberpulse:cyberpulse@postgres:5432/cyberpulse
      ML_SERVICE_URL: http://ml-service:8000
      NEXT_PUBLIC_MAP_TILE_URL: https://demotiles.maplibre.org/style.json
      NEXT_PUBLIC_APP_NAME: CyberPulse AI
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }

volumes: { pgdata: }
