[mypy]
plugins = pydantic.mypy
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True

; RULE-ai.md: "Type hints on every signature in engine/; mypy strict." —
; only engine/ is held to strict mode, since it is the numerically critical
; path. The rest of the service is still checked, just not at that bar.
[mypy-app.engine.*]
strict = True

; sklearn, shap and h3 ship no type stubs (py.typed marker absent upstream);
; this only silences the missing-stub warning, it does not weaken strict
; checking of our own code that calls them.
[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-shap.*]
ignore_missing_imports = True

[mypy-h3.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True
